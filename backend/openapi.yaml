      properties:
        type: {type: string, enum: [weekly, monthly]}
        weekdays: {type: array, minItems: 1, maxItems: 7, nullable: true, items: {type: integer, minimum: 1, maximum: 7}}
        dayOfMonth: {type: integer, minimum: 1, maximum: 31, nullable: true}
