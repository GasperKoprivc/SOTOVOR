openapi: 3.0.3
info: {title: Sotovor native API, version: 1.0.0}
servers: [{url: /api/v1}]
security: [{bearer: []}, {browserSession: []}]
paths:
  /widget/today:
    get:
      summary: List the selected member's open tasks due today for the Android widget
      parameters:
        - $ref: '#/components/parameters/ShoppingHousehold'
      responses:
        '200':
          description: Up to twenty of the member's current tasks, using Europe/Ljubljana dates
          content:
            application/json:
              schema:
                type: object
                required: [householdId, tasks]
                properties:
                  householdId: {type: string}
                  tasks: {type: array, items: {type: object, required: [id, title], properties: {id: {type: string}, title: {type: string}}}}
  /rewards:
    parameters:
      - $ref: '#/components/parameters/ShoppingHousehold'
    get:
      summary: Read the family's reward thresholds and permitted scores
      responses:
        '200':
          description: Rewards and scores
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RewardSettings'
                  - {type: object, required: [scores], properties: {scores: {type: array, items: {type: object, required: [id, name, points], properties: {id: {type: string}, name: {type: string}, points: {type: integer, minimum: 0}}}}}}
    put:
      summary: Replace reward thresholds and leaderboard visibility as an administrator
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RewardSettings'}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '403': {description: Administrator required}
  /tasks/{id}/comments:
    post:
      summary: Post a comment and notify other members
      parameters:
        - $ref: '#/components/parameters/ShoppingHousehold'
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["text"], "properties": {"text": {"type": "string", "maxLength": 500}}}}}}
      responses:
        '201': {description: Checklist and comments, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDetails'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /tasks/{id}/checklist/{item}:
    put:
      summary: Change the checked state of a checklist item
      parameters:
        - $ref: '#/components/parameters/ShoppingHousehold'
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
        - {name: item, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["checked"], "properties": {"checked": {"type": "boolean"}}}}}}
      responses:
        '200': {description: Checklist and comments, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDetails'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /tasks/{id}/checklist:
    post:
      summary: Add a checklist item to an open task
      parameters:
        - $ref: '#/components/parameters/ShoppingHousehold'
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["title"], "properties": {"title": {"type": "string", "maxLength": 160}}}}}}
      responses:
        '201': {description: Checklist and comments, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDetails'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /tasks/{id}/details:
    get:
      summary: Read the task checklist and comments
      parameters:
        - $ref: '#/components/parameters/ShoppingHousehold'
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
      responses:
        '200': {description: Checklist and comments, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDetails'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /calendar/subscription:
    get:
      summary: Read the authenticated account's private subscription status
      responses:
        '200': {description: Status without the secret path, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSubscription'}}}}
    post:
      summary: Create or replace the authenticated account's subscription link
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '201': {description: This is the only response that returns the private path, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSubscription'}}}}
    delete:
      summary: Revoke the current subscription link
      responses:
        '200': {description: Subscription disabled, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSubscription'}}}}
  /calendar/feed/{file}:
    get:
      security: []
      summary: Read the private iCalendar feed using the secret filename
      parameters:
        - {name: file, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}[.]ics$'}}
      responses:
        '200': {description: Calendar entries for current memberships, content: {text/calendar: {schema: {type: string}}}}
        '404': {description: The supplied subscription is invalid or revoked}
  /shopping:
    parameters:
      - $ref: '#/components/parameters/ShoppingHousehold'
    get:
      summary: List the selected family's shopping items
      responses:
        '200': {description: Shopping items, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ShoppingItem'}}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
    post:
      summary: Add an item to the selected family's list
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [title], properties: {title: {type: string, minLength: 1, maxLength: 120}, quantity: {type: string, maxLength: 40}}}
      responses:
        '201': {description: Item added, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingItem'}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
  /shopping/{id}:
    parameters:
      - $ref: '#/components/parameters/ShoppingHousehold'
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
    put:
      summary: Mark an item purchased or return it to the active list
      description: A repeated check preserves the original buyer until the item is unchecked.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [checked], properties: {checked: {type: boolean}}}}}}
      responses:
        '200': {description: Current item, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingItem'}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
    delete:
      summary: Remove an item from the list
      responses:
        '200': {description: Removed, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
  /shopping/stream:
    get:
      summary: Subscribe to shopping-list invalidations via server-sent events
      description: An initial refresh event and subsequent refresh events instruct the client to fetch the list again. Reconnect after the server closes the stream.
      parameters:
        - $ref: '#/components/parameters/ShoppingHousehold'
        - {name: household, in: query, schema: {type: string, pattern: '^[a-f0-9]{24}$'}}
      responses:
        '200': {description: Invalidation stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
  /shopping/push:
    parameters:
      - $ref: '#/components/parameters/ShoppingHousehold'
    get:
      summary: Read the account's Android shopping push preference
      responses:
        '200': {description: Current preference, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingPush'}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
    put:
      summary: Enable or disable Android shopping push notifications
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingPush'}}}}
      responses:
        '200': {description: Saved preference, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingPush'}}}}
        default: {$ref: '#/components/responses/ShoppingError'}
  /me/export:
    get:
      summary: Export the authenticated account’s personal data
      responses:
        '200': {description: Personal account data as an attachment, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalExport'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me:
    delete:
      summary: Delete the authenticated account after confirming the password
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}, deleteOwnedFamilies: {type: boolean}}}}}}
      responses:
        '200': {description: Account removed, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/password/request:
    post:
      summary: Send a single-use password reset link when SMTP is configured
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}}
      responses:
        '200': {description: Request received, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/password/reset:
    post:
      summary: Replace the password with a single-use reset token
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token, password], properties: {token: {type: string}, password: {type: string, minLength: 10, maxLength: 128}}}}}}
      responses:
        '200': {description: Password changed, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        default: {description: Request failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /mobile/min-version:
    get:
      summary: "Get minimum and latest supported app versions"
      security: []
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MinVersion"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /auth/register:
    post:
      summary: "Register a shared Sotovor account"
      security: []
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Registration"}}}}
      responses:
        '201': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /auth/email/resend:
    post:
      summary: "Send another verification email"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /mobile/auth/login:
    post:
      summary: "Sign in a native device"
      security: []
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Login"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Tokens"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /mobile/auth/refresh:
    post:
      summary: "Rotate the access and refresh credentials"
      security: []
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Refresh"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Tokens"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /mobile/auth/logout:
    post:
      summary: "Revoke the current native device"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /mobile/auth/sessions:
    get:
      summary: "List the current account’s native devices"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/Session"}}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /mobile/auth/sessions/{id}:
    delete:
      summary: "Revoke a native device"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /dashboard:
    get:
      summary: "Read account, household and workspace state"
      parameters:
        - {"in":"query","name":"includeEntries","schema":{"type":"boolean","default":true}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Dashboard"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households:
    post:
      summary: "Create a family space"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateHousehold"}}}}
      responses:
        '201': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HouseholdId"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/join:
    post:
      summary: "Join a family with its invitation code"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Invite"}}}}
      responses:
        '201': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HouseholdId"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/invite/rotate:
    post:
      summary: "Generate a replacement invite code"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/leave:
    post:
      summary: "Request to leave a family"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/members/{id}/planning:
    post:
      summary: "Apply member action: planning"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberPlanning"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/members/{id}/permissions:
    post:
      summary: "Apply member action: permissions"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Permissions"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/members/{id}/deny:
    post:
      summary: "Apply member action: deny"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /households/members/{id}/remove:
    post:
      summary: "Apply member action: remove"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /tasks:
    get:
      summary: "Page through tasks in the selected family"
      parameters:
        - {"in":"query","name":"limit","schema":{"type":"integer","minimum":1,"maximum":100,"default":30}}
        - {"in":"query","name":"cursor","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {in: query, name: state, schema: {type: string, enum: [all, mine, available, due, recurring, done]}}
        - {in: query, name: search, schema: {type: string, maxLength: 160}}
        - {in: query, name: category, schema: {type: string, enum: [dom, druzina, opravki, zdravje, drugo]}}
        - {in: query, name: assignee, schema: {type: string}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EntryPage"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /events:
    get:
      summary: "Page through events in the selected family"
      parameters:
        - {"in":"query","name":"limit","schema":{"type":"integer","minimum":1,"maximum":100,"default":30}}
        - {"in":"query","name":"cursor","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EntryPage"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /entries/{id}:
    get:
      summary: "Read a single entry with its current version"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Entry"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /entries:
    post:
      summary: "Create a task or calendar event"
      parameters:
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EntryInput"}}}}
      responses:
        '201': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Dashboard"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /entries/{id}/edit:
    post:
      summary: "Edit an entry at its expected version"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EntryEdit"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Dashboard"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /entries/{id}/remove:
    post:
      summary: "Remove an entry at its expected version"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Version"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Dashboard"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /tasks/{id}/claim:
    post:
      summary: "Apply task action: claim"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Dashboard"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /tasks/{id}/cover:
    post:
      summary: "Apply task action: cover"
      parameters:
        - {"in":"path","name":"id","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
        - {"in":"header","name":"X-Sotovor-Household","schema":{"type":"string","pattern":"^[0-9a-f]{24}$"}}
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object"}}}}
      responses:
        '200': {"description":"Successful response","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Dashboard"}}}}
        default: {"description":"Error response using the original HTTP status and a Slovenian message.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  /tasks/{id}/complete:
