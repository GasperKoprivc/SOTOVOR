[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose = "2025.10.00"
activity = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.5"
hilt = "2.57.2"
serialization = "1.9.0"
retrofit = "3.0.0"
okhttp = "4.12.0"
datastore = "1.3.0"
splash = "1.2.0"
browser = "1.9.0"
google-services = "4.4.4"
firebase = "35.2.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
material = { module = "androidx.compose.material3:material3" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-json = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
splash = { module = "androidx.core:core-splashscreen", version.ref = "splash" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
junit = "junit:junit:4.13.2"
mockk = "io.mockk:mockk:1.14.6"
turbine = "app.cash.turbine:turbine:1.2.1"
coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
android-test-runner = "androidx.test:runner:1.7.0"
android-test-espresso = "androidx.test.espresso:espresso-core:3.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
