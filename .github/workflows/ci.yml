name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-startup-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test start.bat from a clean checkout
        run: node --test scripts/start.windows.test.js

  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0.38
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and formatting
        run: |
          npm run lint
          npm run format:check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: |
          node --check backend/src/api.js
          node --check backend/src/db.js
          node --check backend/src/server.js
          node --check backend/src/recurrence.js
          node --check backend/src/whatsapp.js
          node --check scripts/start.js
      - name: Check the shared app version
        run: npm run version:sync -- --check
      - name: Test API with MongoDB
        run: npm test
        env:
          SOTOVOR_MONGO_URI: mongodb://127.0.0.1:27017
      - name: Validate native API contract
        run: node backend/test/validate-openapi.js
      - name: Build frontend
        run: npm run build
      - name: Test production stack and backup restore
        run: bash scripts/test-prod.sh

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gasperkoprivc/sotovor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
