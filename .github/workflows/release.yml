name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require successful launch checks for the release commit
        uses: actions/github-script@v9
        with:
          script: |
            const deadline = Date.now() + 40 * 60 * 1000;
            const names = ['CI', 'Android', 'Launch quality gate'];
            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, event: 'push', per_page: 100,
              });
              const latestRun = name => runs.filter(run => run.name === name).sort((a, b) => b.id - a.id)[0];
              if (names.every(name => latestRun(name)?.conclusion === 'success')) return;
              const failed = names.find(name => {
                const latest = latestRun(name);
                return ['failure', 'timed_out', 'action_required'].includes(latest?.conclusion);
              });
              if (failed) return core.setFailed(failed + ' failed for this release commit.');
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            core.setFailed('Timed out waiting for all launch quality checks.');
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      origin: ${{ steps.release.outputs.origin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release version and production origin
        id: release
        env:
          CONFIGURED_ORIGIN: ${{ vars.SOTOVOR_PRODUCTION_URL }}
        run: |
          npm run version:sync -- --check
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json'));
          const tagBuild = process.env.GITHUB_REF_TYPE === 'tag';
          const origin = URL.parse(process.env.CONFIGURED_ORIGIN || (tagBuild ? '' : 'https://sotovor.example.com'));
          if (origin?.protocol !== 'https:' || origin.href !== origin.origin + '/' ||
              (tagBuild && (!origin.hostname.includes('.') || /(^|\.)example\.com$|\.(invalid|test|local)$/.test(origin.hostname)))) {
            throw Error('Set the SOTOVOR_PRODUCTION_URL repository variable to the public HTTPS origin.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\norigin=${origin.origin}\n`);
          NODE

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOTOVOR_BUILD_URL: ${{ needs.prepare.outputs.origin }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure NSIS and optional Authenticode
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ github.ref_type == 'tag' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ github.ref_type == 'tag' && secrets.WINDOWS_SIGNING_PFX_PASSWORD || '' }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Configure both Tauri updater signing secrets before tagging.'
          }
          ./scripts/configure-windows-release.ps1
      - name: Build the Windows NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.5
          args: --bundles nsis --config src-tauri/tauri.release.json
      - name: Stage the installer and updater signature
        shell: pwsh
        run: |
          $bundle = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe'
          if (@($bundle).Count -ne 1) { throw 'Expected one Windows installer.' }
          if ($env:WINDOWS_AUTHENTICODE -eq 'true' -and (Get-AuthenticodeSignature $bundle.FullName).Status -ne 'Valid') {
            throw 'Windows Authenticode verification failed.'
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $name = "Sotovor-$env:VERSION-windows-x64-setup.exe"
          Copy-Item -LiteralPath $bundle.FullName -Destination "release-assets/$name"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            Copy-Item -LiteralPath ($bundle.FullName + '.sig') -Destination "release-assets/$name.sig"
          }
          Set-Content -LiteralPath release-assets/windows-authenticode -Value $env:WINDOWS_AUTHENTICODE
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    env:
      SOTOVOR_BUILD_URL: ${{ needs.prepare.outputs.origin }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_GOOGLE_SERVICES_BASE64: ${{ github.ref_type == 'tag' && secrets.ANDROID_GOOGLE_SERVICES_BASE64 || '' }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_FILE=''
          suffix=-unsigned
          if [[ -n "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
            : "${ANDROID_KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64}" "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD}"
            : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS}" "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD}"
            ANDROID_KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/sotovor-keystore.XXXXXX")
            trap 'rm -f -- "$ANDROID_KEYSTORE_FILE" app/google-services.json' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
            suffix=''
          else
            echo '::warning::Android keystore secrets are absent. Both Android packages will be unsigned.'
            trap 'rm -f -- app/google-services.json' EXIT
          fi
          if [[ -n "$ANDROID_GOOGLE_SERVICES_BASE64" ]]; then
            printf '%s' "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          fi
          ./gradlew lintRelease assembleRelease bundleRelease "-PsotovorReleaseUrl=$SOTOVOR_BUILD_URL"
          mkdir -p ../../release-assets
          apk=app/build/outputs/apk/release/app-release.apk
          if [[ -z "$suffix" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          else
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          cp "$apk" "../../release-assets/Sotovor-$VERSION$suffix.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../release-assets/Sotovor-$VERSION$suffix.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: android-r8-mapping-${{ needs.prepare.outputs.version }}
          path: apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [prepare, windows, android, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate release metadata and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOTOVOR_BUILD_URL: ${{ needs.prepare.outputs.origin }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/release-metadata.js
          {
            echo '## Namestitev'
            echo "Namestitveni programi in kontrolne vsote SHA-256 so spodaj. Uradna stran je $SOTOVOR_BUILD_URL/prenesi."
            if grep -qix 'true' release-assets/windows-authenticode; then
              echo '<!-- sotovor-windows-authenticode -->'
            else
              echo 'Windows EXE nima podpisa Authenticode. SmartScreen lahko prikaže opozorilo.'
            fi
            if [[ -f "release-assets/Sotovor-$VERSION-unsigned.apk" ]]; then
              echo 'Android APK in AAB sta nepodpisana. Pred namestitvijo oziroma objavo ju je treba podpisati.'
            fi
          } > release-notes.md
          rm -- release-assets/windows-authenticode
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == true ]] || { echo 'This tag already has a published release.' >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Sotovor $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file release-notes.md
