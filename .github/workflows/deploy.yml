name: Deploy production

on:
  workflow_run:
    workflows: [CI, Android, Launch quality gate]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: sotovor-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      published: ${{ steps.head.outputs.current }}
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require all quality workflows for this commit
        id: quality
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: process.env.TESTED_SHA, event: 'push', per_page: 100,
            });
            const ready = ['CI', 'Android', 'Launch quality gate'].every(name => {
              const latest = runs.filter(run => run.name === name).sort((a, b) => b.id - a.id)[0];
              return latest?.conclusion === 'success';
            });
            core.setOutput('ready', String(ready));
            if (!ready) core.info('Waiting for successful CI, Android and launch quality workflows.');
      - name: Check the tested commit is still main
        if: steps.quality.outputs.ready == 'true'
        id: head
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" == "$TESTED_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.head.outputs.current == 'true'
      - uses: docker/login-action@v3
        if: steps.head.outputs.current == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish tested image
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            gasperkoprivc/sotovor:latest
            gasperkoprivc/sotovor:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy over SSH and smoke-test HTTPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$TESTED_SHA" ]]; then
            echo 'This deployment was superseded by a newer push.'
            exit 0
          fi
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_client=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 -i "$ssh_dir/key"
            -l "$DEPLOY_USER" "$DEPLOY_HOST")
          tar -cf - compose.prod.yaml Caddyfile deploy/mongo-init.js \
            scripts/{backup,restore,prod-compose,deploy-prod,smoke-prod}.sh |
            "${ssh_client[@]}" 'cd /opt/sotovor && umask 077 && tar --no-same-owner -xf -'
          "${ssh_client[@]}" "cd /opt/sotovor && bash scripts/deploy-prod.sh $TESTED_SHA"
