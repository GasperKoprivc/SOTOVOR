name: Android

on:
  push:

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Kotlin static checks
        run: ./gradlew ktlintCheck detekt
      - name: Resolve and audit Android dependencies
        run: |
          ./gradlew :app:dependencyInventory
          cd ../..
          node scripts/audit-gradle.js
      - name: Lint, test and build without Firebase
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sotovor-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build the optional Firebase variant
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            ./gradlew assembleDebug
            echo "firebase_apk=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: env.firebase_apk == 'true'
        with:
          name: sotovor-android-firebase-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-static-reports
          path: |
            apps/android/app/build/reports/
            quality-results/gradle-audit.json
